name: "Deploy"
description: |
  Deploy docker image to namespace.

  The actual deployment requires ./bin/deploy to exist in the repository and be executable.

  The inputs supplied can be used by helm or kubernetes to deploy branches or main/master to any environment.
  The inputs are passed to ./bin/deploy as environment variables. This requires ./bin/deploy to be written to use
  the environment variables as required. The inputs are also used to authenticate to the kubernetes
  cluster and assume the ECR role.

  Typically, the ./bin/deploy script called will differentiate whether to deploy to an ephemeral host based on
  the app-environment variable supplied.

  e.g. for ./bin/deploy script
  #!/usr/bin/env bash

  if [[ "$ENVIRONMENT" == "uat" ]]; then
    deploy_branch
  else
    deploy_main
  fi

inputs:
  ecr-registry:
    description: "ECR registry"
    required: true
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-region:
    description: "ECR region"
    required: true
  ecr-role-to-assume:
    description: "ECR role to assume"
    required: true
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "Environment to which the app is being deployed [uat, staging, production]"
    required: true
  script-path:
    description: "Path to the deploy script to run"
    default: "./bin/deploy"
    required: false
  branch-name:
    description: "Branch name, see helm deployment step for its use"
    required: false
  release-name:
    description: "Release name, see helm deployment step for its use"
    required: false
  slack-notification-on-success:
    description: 'Whether to send a Slack notification on success'
    required: false
    default: 'false'
  slack-notification-on-failure:
    description: 'Whether to send a Slack notification on failure'
    required: false
    default: 'false'
  slack-access-token:
    description: 'The Slack access token to use for notifications'
    required: false
  slack-channel-id:
    description: 'The Slack channel ID to send notifications to'
    required: false

runs:
  using: "composite"

  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Validate inputs
      shell: bash
      env:
        SLACK_NOTIFICATION_ON_SUCCESS: ${{ inputs.slack-notification-on-success }}
        SLACK_NOTIFICATION_ON_FAILURE: ${{ inputs.slack-notification-on-failure }}
        SLACK_ACCESS_TOKEN: ${{ inputs.slack-access-token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
      run: |
        set -euo pipefail

        if [[ "$SLACK_NOTIFICATION_ON_SUCCESS" == "true" || "$SLACK_NOTIFICATION_ON_FAILURE" == "true" ]]; then
          if [[ -z "$SLACK_ACCESS_TOKEN" || -z "$SLACK_CHANNEL_ID" ]]; then
            echo "slack-access-token and slack-channel-id are required when slack-notification-on-success or slack-notification-on-failure is true"
            exit 1
          fi
        fi

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Assume role in Cloud Platform
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6.0.0
      with:
        role-to-assume: ${{ inputs.ecr-role-to-assume }}
        aws-region: ${{ inputs.ecr-region }}

    - name: Deploy with script
      id: deploy
      shell: bash
      env:
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        GIT_SHA: ${{ github.sha }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        VALUES_FILE: ./deploy/helm/values-${{ inputs.app-environment }}.yaml
        BRANCH_NAME: ${{ inputs.branch-name }}
        RELEASE_NAME: ${{ inputs.release-name }}
        ENVIRONMENT: ${{ inputs.app-environment }}
      run: |
        ${{ inputs.script-path }}

    - name: Notify Slack of success
      if: success() && steps.deploy.outcome == 'success' && inputs.slack-notification-on-success == 'true'
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # V4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-access-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: |
            :green: Deployment succeeded

            *Environment:* `${{ inputs.app-environment}}`
            *Repository:* `${{ github.repository }}`
            *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Notify Slack of failure
      if: failure() && steps.deploy.outcome == 'failure' && inputs.slack-notification-on-failure == 'true'
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # V4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-access-token }}
        payload: |
          channel: ${{ inputs.slack-channel-id }}
          text: |
            :nope-9607: Deployment failed

            *Environment:* `${{ inputs.app-environment}}`
            *Repository:* `${{ github.repository }}`
            *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
