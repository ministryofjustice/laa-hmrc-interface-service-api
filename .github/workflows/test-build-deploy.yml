name: CI and CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - &checkout-code
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #--v7.0.1

      - &setup-ruby
        name: Setup Ruby and install gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #--v1.321.0
        with:
          bundler-cache: true

      - name: Run rubocop
        run: |
          bundle exec rubocop

  rspec:
    runs-on: ubuntu-latest
    env: &test-env
      RACK_ENV: test
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/laa_hmrc_interface_service_api_test"
      SECRET_KEY_BASE: not-a-real-secret-key-base
      REDIS_URL: redis://127.0.0.1:6379/0

    services:
      postgres: &postgres-service
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laa_hmrc_interface_service_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laa_hmrc_interface_service_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis: &redis-service
        image: redis:7.0.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:

      - *checkout-code
      - *setup-ruby

      - &prepare-database
        name: Setup test database
        run: bin/rails db:prepare

      - name: Run tests
        run: bundle exec rspec

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    if: github.actor != 'dependabot[bot]'
    needs: [rubocop, rspec]
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    outputs:
      image: ${{ steps.build_and_push.outputs.image }}
      branch-name: ${{ steps.build_and_push.outputs.branch-name }}
      release-name: ${{ steps.build_and_push.outputs.release-name }}

    steps:
      - *checkout-code

      - name: Build and push
        id: build_and_push
        uses:  ministryofjustice/laa-civil-apply-build-and-push@main
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs: build
    environment: uat
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy UAT branch
        id: deploy_uat_branch
        uses: ministryofjustice/laa-civil-apply-deploy@main
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.K8S_GHA_UAT_CLUSTER_CERT }}
          kube-token: ${{ secrets.K8S_GHA_UAT_TOKEN }}
          kube-cluster: ${{ secrets.K8S_GHA_UAT_CLUSTER_NAME }}
          kube-namespace: ${{ secrets.K8S_GHA_UAT_NAMESPACE }}
          branch-name: ${{ needs.build.outputs.branch-name }}
          release-name: ${{ needs.build.outputs.release-name }}
          app-environment: uat
          slack-notification-on-failure: 'true'
          slack-access-token: ${{ secrets.SLACK_ACCESS_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy Staging branch
        id: deploy_staging_branch
        uses: ministryofjustice/laa-civil-apply-deploy@main
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.K8S_GHA_STAGING_CLUSTER_CERT }}
          kube-token: ${{ secrets.K8S_GHA_STAGING_TOKEN }}
          kube-cluster: ${{ secrets.K8S_GHA_STAGING_CLUSTER_NAME }}
          kube-namespace: ${{ secrets.K8S_GHA_STAGING_NAMESPACE }}
          app-environment: staging
          slack-notification-on-failure: 'true'
          slack-access-token: ${{ secrets.SLACK_ACCESS_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write

    steps:
      - *checkout-code

      - name: Deploy Production branch
        id: deploy_production_branch
        uses: ministryofjustice/laa-civil-apply-deploy@main
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.K8S_GHA_PRODUCTION_CLUSTER_CERT }}
          kube-token: ${{ secrets.K8S_GHA_PRODUCTION_TOKEN }}
          kube-cluster: ${{ secrets.K8S_GHA_PRODUCTION_CLUSTER_NAME }}
          kube-namespace: ${{ secrets.K8S_GHA_PRODUCTION_NAMESPACE }}
          app-environment: production
          slack-notification-on-failure: 'true'
          slack-access-token: ${{ secrets.SLACK_ACCESS_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
